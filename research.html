<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Post-JARVIS Research Lab · 365-Day Frontier AI Curriculum</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #070b14;
      --bg-surface: #0d1527;
      --bg-card: rgba(16, 26, 46, 0.78);
      --bg-card-hover: rgba(22, 36, 64, 0.9);
      --bg-card-elevated: #131f37;
      --bg-input: #09101f;
      --border: rgba(148, 163, 184, 0.12);
      --border-hover: rgba(168, 85, 247, 0.4);
      --border-focus: #a855f7;
      
      --txt-primary: #f8fafc;
      --txt-secondary: #cbd5e1;
      --txt-muted: #94a3b8;
      
      --cyan: #38bdf8;
      --cyan-soft: rgba(56, 189, 248, 0.12);
      --indigo: #818cf8;
      --indigo-soft: rgba(129, 140, 248, 0.12);
      --violet: #a855f7;
      --violet-soft: rgba(168, 85, 247, 0.14);
      --green: #34d399;
      --green-soft: rgba(52, 211, 153, 0.12);
      --amber: #fbbf24;
      --amber-soft: rgba(251, 191, 36, 0.12);
      --rose: #fb7185;
      --rose-soft: rgba(251, 113, 133, 0.12);
      
      --shadow-sm: 0 2px 8px rgba(0,0,0,0.3);
      --shadow-card: 0 12px 36px -4px rgba(0,0,0,0.45), 0 0 0 1px var(--border);
      --shadow-glow: 0 0 40px -10px rgba(168, 85, 247, 0.25);
      
      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-lg: 20px;
      --radius-full: 9999px;
      
      --font-sans: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --font-mono: 'JetBrains Mono', 'Fira Code', monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      background: radial-gradient(ellipse 90% 50% at 50% -15%, rgba(168, 85, 247, 0.18), transparent 70%),
                  radial-gradient(ellipse 60% 40% at 10% 20%, rgba(56, 189, 248, 0.1), transparent 60%),
                  var(--bg);
      background-attachment: fixed;
      color: var(--txt-primary);
      font-family: var(--font-sans);
      font-size: 15px;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
    }

    .app-shell {
      max-width: 1440px;
      margin: 0 auto;
      padding: 24px 28px 80px;
    }

    /* Top Navigation Header */
    .top-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      padding: 16px 24px;
      background: rgba(13, 21, 39, 0.7);
      backdrop-filter: blur(20px);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      margin-bottom: 24px;
      box-shadow: var(--shadow-card);
    }

    .brand-area {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .brand-icon {
      width: 46px;
      height: 46px;
      border-radius: var(--radius-md);
      background: linear-gradient(135deg, #7c3aed, #06b6d4);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      box-shadow: 0 0 20px rgba(124, 58, 237, 0.4);
    }

    .brand-title {
      font-size: 19px;
      font-weight: 800;
      letter-spacing: -0.02em;
      background: linear-gradient(90deg, #ffffff, #cbd5e1);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .brand-subtitle {
      font-size: 12px;
      color: var(--violet);
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .date-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border);
      border-radius: var(--radius-full);
      font-size: 13px;
      font-weight: 600;
      color: var(--txt-secondary);
      font-family: var(--font-mono);
    }

    .gate-switch-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 9px 18px;
      background: linear-gradient(135deg, rgba(56, 189, 248, 0.2), rgba(99, 102, 241, 0.2));
      border: 1px solid rgba(56, 189, 248, 0.4);
      border-radius: var(--radius-full);
      color: #e0f2fe;
      font-size: 13px;
      font-weight: 700;
      text-decoration: none;
      transition: all 0.25s ease;
      box-shadow: 0 0 15px rgba(56, 189, 248, 0.2);
    }

    .gate-switch-btn:hover {
      background: linear-gradient(135deg, rgba(56, 189, 248, 0.35), rgba(99, 102, 241, 0.35));
      border-color: var(--cyan);
      transform: translateY(-1px);
    }

    /* Navigation Bar */
    .nav-bar {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 6px;
      background: rgba(13, 21, 39, 0.7);
      backdrop-filter: blur(16px);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      margin-bottom: 26px;
      box-shadow: var(--shadow-sm);
    }

    .nav-btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 10px 18px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--txt-muted);
      font-size: 14px;
      font-weight: 600;
      border-radius: var(--radius-md);
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s ease;
      font-family: var(--font-sans);
    }

    .nav-btn:hover {
      color: var(--txt-primary);
      background: rgba(255, 255, 255, 0.05);
    }

    .nav-btn.active {
      background: linear-gradient(135deg, rgba(168, 85, 247, 0.25), rgba(56, 189, 248, 0.2));
      border-color: rgba(168, 85, 247, 0.45);
      color: var(--txt-primary);
      font-weight: 700;
      box-shadow: 0 4px 16px rgba(168, 85, 247, 0.25);
    }

    .nav-btn .badge {
      background: rgba(255, 255, 255, 0.1);
      padding: 2px 7px;
      border-radius: var(--radius-full);
      font-size: 11px;
      font-family: var(--font-mono);
    }

    .nav-btn.active .badge {
      background: var(--violet);
      color: #ffffff;
      font-weight: 700;
    }

    /* Common Card Styles */
    .card {
      background: var(--bg-card);
      backdrop-filter: blur(20px);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 24px;
      box-shadow: var(--shadow-card);
      transition: border-color 0.2s ease, transform 0.2s ease;
    }

    .card:hover {
      border-color: var(--border-hover);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      gap: 20px;
    }

    .col-12 { grid-column: span 12; }
    .col-8  { grid-column: span 8; }
    .col-7  { grid-column: span 7; }
    .col-6  { grid-column: span 6; }
    .col-5  { grid-column: span 5; }
    .col-4  { grid-column: span 4; }
    .col-3  { grid-column: span 3; }

    h1, h2, h3, h4 {
      color: var(--txt-primary);
      letter-spacing: -0.02em;
      font-weight: 700;
    }

    h1 { font-size: 28px; line-height: 1.25; }
    h2 { font-size: 20px; line-height: 1.35; margin-bottom: 6px; }
    h3 { font-size: 16px; font-weight: 600; }

    .eyebrow {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--violet);
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .subtext {
      color: var(--txt-muted);
      font-size: 14px;
      line-height: 1.6;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px 18px;
      border-radius: var(--radius-md);
      font-size: 14px;
      font-weight: 600;
      font-family: var(--font-sans);
      cursor: pointer;
      border: 1px solid var(--border);
      background: var(--bg-surface);
      color: var(--txt-primary);
      transition: all 0.2s ease;
      text-decoration: none;
    }

    .btn:hover {
      border-color: var(--border-hover);
      transform: translateY(-1px);
    }

    .btn-primary {
      background: linear-gradient(135deg, #7c3aed, #a855f7);
      color: #ffffff;
      border-color: rgba(168, 85, 247, 0.6);
      font-weight: 700;
      box-shadow: 0 4px 18px rgba(168, 85, 247, 0.35);
    }

    .btn-primary:hover {
      background: linear-gradient(135deg, #8b5cf6, #c084fc);
    }

    .btn-cyan {
      background: linear-gradient(135deg, #0284c7, #06b6d4);
      color: #030712;
      border-color: rgba(56, 189, 248, 0.5);
      font-weight: 700;
    }

    .btn-success {
      background: linear-gradient(135deg, #059669, #10b981);
      color: #022c22;
      border-color: rgba(16, 185, 129, 0.5);
      font-weight: 700;
    }

    .btn-sm {
      padding: 6px 12px;
      font-size: 12px;
      border-radius: var(--radius-sm);
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 10px;
      border-radius: var(--radius-full);
      font-size: 12px;
      font-weight: 700;
      font-family: var(--font-mono);
    }

    .pill-cyan { background: var(--cyan-soft); color: var(--cyan); border: 1px solid rgba(56, 189, 248, 0.25); }
    .pill-violet { background: var(--violet-soft); color: var(--violet); border: 1px solid rgba(168, 85, 247, 0.3); }
    .pill-green { background: var(--green-soft); color: var(--green); border: 1px solid rgba(52, 211, 153, 0.25); }
    .pill-amber { background: var(--amber-soft); color: var(--amber); border: 1px solid rgba(251, 191, 36, 0.25); }

    label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--txt-secondary);
      margin-bottom: 6px;
    }

    input, select, textarea {
      width: 100%;
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 10px 14px;
      color: var(--txt-primary);
      font-family: var(--font-sans);
      font-size: 14px;
      outline: none;
      transition: all 0.2s ease;
    }

    input:focus, select:focus, textarea:focus {
      border-color: var(--border-focus);
      box-shadow: 0 0 0 3px rgba(168, 85, 247, 0.15);
    }

    textarea {
      resize: vertical;
      min-height: 84px;
      line-height: 1.5;
    }

    .progress-bar-wrap {
      width: 100%;
      height: 8px;
      background: rgba(255, 255, 255, 0.07);
      border-radius: var(--radius-full);
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #7c3aed, #a855f7, #38bdf8);
      border-radius: var(--radius-full);
      transition: width 0.4s ease;
    }

    /* =========================================================
       RICH DETAILED DAILY SYLLABUS CARD (THE CORE FEATURE)
       ========================================================= */
    .syllabus-detail-card {
      background: linear-gradient(135deg, rgba(16, 26, 46, 0.95), rgba(26, 38, 70, 0.9));
      border: 1px solid rgba(168, 85, 247, 0.35);
      border-radius: var(--radius-lg);
      padding: 26px 28px;
      margin-bottom: 24px;
      box-shadow: var(--shadow-card), 0 0 35px -10px rgba(168, 85, 247, 0.25);
      position: relative;
    }

    .syllabus-hero-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      flex-wrap: wrap;
      gap: 16px;
      margin-bottom: 18px;
      padding-bottom: 16px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .month-jump-select {
      background: var(--bg-surface);
      color: var(--txt-primary);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 6px 12px;
      font-size: 13px;
      font-weight: 600;
      outline: none;
      cursor: pointer;
    }

    .month-jump-select:hover {
      border-color: var(--violet);
    }

    .syllabus-content-grid {
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      gap: 20px;
      margin-top: 20px;
    }

    .subtopics-box {
      background: rgba(10, 17, 32, 0.7);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 18px;
      border-left: 3px solid var(--cyan);
    }

    .equation-box {
      background: rgba(10, 17, 32, 0.7);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 18px;
      border-left: 3px solid var(--violet);
    }

    .equation-display {
      font-family: var(--font-mono);
      font-size: 14px;
      background: rgba(4, 8, 18, 0.85);
      border: 1px solid rgba(168, 85, 247, 0.25);
      border-radius: var(--radius-sm);
      padding: 12px 16px;
      color: #38bdf8;
      margin: 10px 0 8px;
      line-height: 1.5;
      overflow-x: auto;
    }

    .subtopic-item-check {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 10px;
      font-size: 13.5px;
      color: var(--txt-secondary);
      line-height: 1.5;
    }

    .subtopic-checkbox {
      margin-top: 3px;
      accent-color: var(--cyan);
      cursor: pointer;
      width: 16px;
      height: 16px;
    }

    .subtopic-text.checked {
      text-decoration: line-through;
      color: var(--txt-muted);
    }

    .objective-list {
      list-style: none;
      padding: 0;
      margin-top: 8px;
    }

    .objective-list li {
      position: relative;
      padding-left: 20px;
      margin-bottom: 6px;
      font-size: 13.5px;
      color: var(--txt-secondary);
      line-height: 1.5;
    }

    .objective-list li::before {
      content: '✓';
      position: absolute;
      left: 0;
      top: 0;
      color: var(--green);
      font-weight: bold;
    }

    .build-acceptance-card {
      background: rgba(10, 17, 32, 0.7);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 18px;
      border-left: 3px solid var(--green);
      margin-top: 14px;
    }

    .resource-banner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      background: rgba(14, 22, 40, 0.65);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 12px 18px;
      margin-top: 16px;
    }

    /* Daily Research Timeline Cards */
    .timeline-step-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 18px 22px;
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 20px;
      align-items: flex-start;
      margin-bottom: 14px;
      transition: all 0.2s ease;
    }

    .timeline-step-card:hover {
      border-color: var(--border-hover);
      background: var(--bg-card-hover);
      transform: translateX(3px);
    }

    .timeline-step-card.completed {
      border-color: rgba(52, 211, 153, 0.3);
      background: rgba(16, 32, 42, 0.6);
    }

    .step-time-badge {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-width: 100px;
      padding: 10px 12px;
      background: rgba(10, 17, 32, 0.85);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      text-align: center;
    }

    .step-time-range {
      font-family: var(--font-mono);
      font-size: 12px;
      font-weight: 700;
      color: var(--violet);
    }

    .step-duration {
      font-size: 11px;
      color: var(--txt-muted);
      margin-top: 2px;
    }

    .step-checkbox-btn {
      padding: 8px 14px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border);
      background: rgba(13, 21, 39, 0.8);
      color: var(--txt-secondary);
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
      white-space: nowrap;
    }

    .step-checkbox-btn:hover {
      border-color: var(--violet);
      color: var(--txt-primary);
    }

    .timeline-step-card.completed .step-checkbox-btn {
      background: rgba(52, 211, 153, 0.15);
      border-color: var(--green);
      color: var(--green);
      font-weight: 700;
    }

    .stat-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 22px;
      box-shadow: var(--shadow-card);
    }

    .stat-card-val {
      font-size: 34px;
      font-weight: 800;
      font-family: var(--font-mono);
      line-height: 1.1;
      margin: 10px 0 4px;
    }

    .toast {
      position: fixed;
      bottom: 28px;
      right: 28px;
      background: linear-gradient(135deg, #0f172a, #1e293b);
      border: 1px solid var(--violet);
      color: var(--txt-primary);
      padding: 14px 22px;
      border-radius: var(--radius-md);
      font-size: 14px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 12px;
      z-index: 9999;
      transform: translateY(120%);
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .toast.show {
      transform: translateY(0);
    }

    @media (max-width: 1024px) {
      .col-8, .col-7, .col-6, .col-5, .col-4, .col-3 { grid-column: span 12; }
      .syllabus-content-grid { grid-template-columns: 1fr; }
      .timeline-step-card { grid-template-columns: 1fr; }
      .top-header { flex-direction: column; align-items: flex-start; }
      .header-actions { width: 100%; justify-content: space-between; }
    }
  </style>
</head>
<body>

<div class="app-shell">
  <!-- Top Navigation Header -->
  <header class="top-header">
    <div class="brand-area">
      <div class="brand-icon">🔬</div>
      <div>
        <div class="brand-subtitle">Post-JARVIS Research Lab</div>
        <div class="brand-title">From AI Builder to Frontier AI Research Engineer</div>
      </div>
    </div>
    <div class="header-actions">
      <div class="date-pill" id="live-date">--</div>
      <a href="index.html" class="gate-switch-btn">
        <span>← 90-Day GATE DA + JARVIS OS</span>
      </a>
    </div>
  </header>

  <!-- Navigation Bar -->
  <nav class="nav-bar" id="lab-nav">
    <button class="nav-btn active" data-tab="daily">
      <span>📅</span>
      <span>Daily Research Plan (365 Days)</span>
      <span class="badge" id="nav-rday-badge">Day 1</span>
    </button>
    <button class="nav-btn" data-tab="home">
      <span>⚡</span>
      <span>Research Command Center</span>
    </button>
    <button class="nav-btn" data-tab="roadmap">
      <span>🗺️</span>
      <span>12-Month Curriculum</span>
      <span class="badge">4 Phases</span>
    </button>
    <button class="nav-btn" data-tab="paper">
      <span>📄</span>
      <span>Paper Reproducer</span>
      <span class="badge">12 Steps</span>
    </button>
    <button class="nav-btn" data-tab="experiment">
      <span>🧪</span>
      <span>Experiment Log</span>
    </button>
    <button class="nav-btn" data-tab="specialize">
      <span>🎯</span>
      <span>Specialization Track</span>
    </button>
  </nav>

  <!-- Main View Container -->
  <main id="lab-viewport"></main>
</div>

<!-- Toast Notification -->
<div id="toast-notify" class="toast">
  <span id="toast-icon">✓</span>
  <span id="toast-msg">Saved successfully</span>
</div>

<script>

function showToast(msg, icon = '✓') {
  var t = document.getElementById('toast-notify');

  var ic = document.getElementById('toast-icon');
  m.textContent = msg;

}

function playChime() {
  try {
    var AudioCtx = window.AudioContext || window.webkitAudioContext;
    if (!AudioCtx) return;
    var ctx = new AudioCtx();
    var osc = ctx.createOscillator();
    var gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.type = 'sine';
    osc.frequency.setValueAtTime(587.33, ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.15);
    gain.gain.setValueAtTime(0.2, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.8);
    osc.start();
    osc.stop(ctx.currentTime + 0.8);
  } catch (e) {}
}

function getDayData(d) {
  if (RESEARCH_SYLLABUS[d]) return RESEARCH_SYLLABUS[d];
  return {
    day: d,
    month: Math.min(12, Math.floor((d - 1) / 30) + 1),
    monthTitle: 'Month ' + Math.min(12, Math.floor((d - 1) / 30) + 1) + ' · Frontier Research',
    phase: d <= 180 ? 'Phase 1 · Foundations' : (d <= 270 ? 'Phase 2 · Paper Reproduction' : 'Phase 3 · Original Research'),
    week: Math.min(52, Math.floor((d - 1) / 7) + 1),
    weekFocus: 'Research Focus · Week ' + Math.min(52, Math.floor((d - 1) / 7) + 1),
    topic: 'Empirical Research Iteration ' + d,
    badge: 'Research',
    subtopics: [
      'Literature review and primary source extraction',
      'Mathematical mechanism derivation and verification',
      'Controlled empirical baseline testing and metric tracking',
      'Error analysis, failure documentation, and next experiment'
    ],
    equation: 'Metric(t) = f(Architecture, Data, Compute, Seeds)',
    eq_desc: 'Rigorous empirical verification with controlled variables and error bars.',
    objectives: [
      'Master the theoretical mechanism from first principles',
      'Execute code implementation with strict acceptance tests',
      'Document findings and write the six-sentence research memo'
    ],
    build: 'Execute today’s component implementation and verify acceptance criteria.',

    resource: { title: 'PyTorch Research Tutorials', url: 'https://docs.pytorch.org/tutorials/' },

  };
}

function bindDailyEvents() {
  var d = state.rday;
  var rec = state.rrecords[d] = state.rrecords[d] || {};
  rec.blocks = rec.blocks || {};

  // Prev / Next / Jump
  var btnPrev = document.getElementById('btn-prev-rday');
  if (btnPrev) btnPrev.onclick = () => {
    if (state.rday > 1) { state.rday--; saveState(); renderDailyView(); window.scrollTo({ top: 0, behavior: 'smooth' }); }
  };

  var btnNext = document.getElementById('btn-next-rday');
  if (btnNext) btnNext.onclick = () => {
    if (state.rday < 365) { state.rday++; saveState(); renderDailyView(); window.scrollTo({ top: 0, behavior: 'smooth' }); }
  };

  var inpJump = document.getElementById('inp-jump-rday');
  if (inpJump) inpJump.onchange = (e) => {
    var v = parseInt(e.target.value);
    if (v >= 1 && v <= 365) { state.rday = v; saveState(); renderDailyView(); window.scrollTo({ top: 0, behavior: 'smooth' }); }
  };

  var selMonth = document.getElementById('select-jump-month');
  if (selMonth) selMonth.onchange = (e) => {
    var m = parseInt(e.target.value);
    var targetDay = (m - 1) * 30 + 1;
    state.rday = Math.min(365, targetDay);
    saveState();
    renderDailyView();
    window.scrollTo({ top: 0, behavior: 'smooth' });
    showToast('Jumped to Month ' + m);
  };

  var btnToday = document.getElementById('btn-today-rday');
  if (btnToday) btnToday.onclick = () => {
    var found = 1;
    for (var i = 1; i <= 365; i++) {
      if (!state.rrecords[i] || !state.rrecords[i].completed) {
        found = i;
        break;
      }
    }
    state.rday = found;
    saveState();
    renderDailyView();
    window.scrollTo({ top: 0, behavior: 'smooth' });
    showToast('Jumped to Day ' + found);
  };

  // Subtopic checkboxes
  document.querySelectorAll('[data-sub-key]').forEach(cb => {
    cb.onchange = () => {
      var key = cb.dataset.subKey;
      state.subtopicsMastered[key] = cb.checked;
      saveState();
      var label = cb.nextElementSibling;
      if (label) {
        if (cb.checked) label.classList.add('checked');
        else label.classList.remove('checked');
      }
    };
  });

  // Timeline Block Toggles
  document.querySelectorAll('[data-toggle-rblock]').forEach(b => {
    b.onclick = () => {
      var blk = b.dataset.toggleRblock;
      rec.blocks[blk] = !rec.blocks[blk];
      saveState();
      renderDailyView();
    };
  });

  // Save Record
  var btnSave = document.getElementById('btn-save-rday');
  if (btnSave) btnSave.onclick = () => {
    rec.hours = document.getElementById('field-rhours').value;
    rec.source = document.getElementById('field-rsource').value;
    rec.evidence = document.getElementById('field-revidence').value;
    rec.result = document.getElementById('field-rresult').value;
    rec.understood = document.getElementById('field-runderstood').value;
    rec.failure = document.getElementById('field-rfailure').value;
    rec.next = document.getElementById('field-rnext').value;
    saveState();
    showToast('Research Day ' + d + ' saved');
  };

  // Toggle Complete
  var btnComplete = document.getElementById('btn-toggle-rcomplete');
  if (btnComplete) btnComplete.onclick = () => {
    rec.completed = !rec.completed;
    if (rec.completed) {
      rec.blocks.b1 = true;
      rec.blocks.b2 = true;
      rec.blocks.b3 = true;
      rec.blocks.b4 = true;
      rec.blocks.b5 = true;
      playChime();
      showToast('Research Day ' + d + ' marked 100% complete! Outstanding!', '🎉');
    } else {
      showToast('Research Day ' + d + ' set back to in-progress');
    }
    saveState();
    renderDailyView();
  };
}

      ${spec.map((s, idx) => `
        <div class="col-4">
          <div class="card" style="height:100%;display:flex;flex-direction:column;justify-content:space-between;${state.special == idx ? 'border-color:var(--violet);box-shadow:0 0 30px rgba(168,85,247,0.25);' : ''}">
            <div>
              <span class="pill pill-violet">SPECIALIZATION 0${idx + 1}</span>
              <h2 style="font-size:22px;margin:8px 0 10px;">${s[0]}</h2>
              <p class="subtext" style="margin-bottom:12px;">${s[1]}</p>
              <div style="font-size:12.5px;color:var(--cyan);background:rgba(56,189,248,0.08);padding:10px;border-radius:var(--radius-md);border:1px solid rgba(56,189,248,0.2);">
                💡 <strong>Target Question:</strong> ${s[2]}
              </div>
            </div>
            <button class="btn ${state.special == idx ? 'btn-primary' : ''}" data-pick-spec="${idx}" style="width:100%;margin-top:20px;">
              <span>${state.special == idx ? '✓ Selected Frontier' : 'Select Direction'}</span>
            </button>
          </div>
        </div>
      `).join('')}
    </div>
  `;

  document.getElementById('lab-viewport').innerHTML = html;
  document.querySelectorAll('[data-pick-spec]').forEach(b => {
    b.onclick = () => {
      state.special = parseInt(b.dataset.pickSpec);
      saveState();
      renderSpecializeView();
      showToast('Specialization Updated');
    };
  });
}

/* ==========================================================
   TAB ROUTER & INITIALIZATION
   ========================================================== */
function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('#lab-nav .nav-btn').forEach(btn => {
    if (btn.dataset.tab === tab) btn.classList.add('active');
    else btn.classList.remove('active');
  });

  if (tab === 'daily') renderDailyView();
  else if (tab === 'home') renderHomeView();
  else if (tab === 'roadmap') renderRoadmapView();
  else if (tab === 'paper') renderPaperView();
  else if (tab === 'experiment') renderExperimentView();
  else if (tab === 'specialize') renderSpecializeView();

  window.scrollTo({ top: 0, behavior: 'smooth' });
}

document.addEventListener('DOMContentLoaded', () => {
  var dEl = document.getElementById('live-date');
  if (dEl) {
    dEl.textContent = new Date().toLocaleDateString('en-IN', {
      weekday: 'short', day: 'numeric', month: 'short', year: 'numeric'
    });
  }
  document.querySelectorAll('#lab-nav .nav-btn').forEach(b => {
    b.onclick = () => switchTab(b.dataset.tab);
  });
  switchTab('daily');
});
</script>
</body>
</html>
